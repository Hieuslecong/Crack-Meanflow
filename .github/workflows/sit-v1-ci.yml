name: CrackMeanFlow-SiT V1 CI

on:
  push:
    branches:
      - journal/crackmeanflow-sit-v1
  workflow_dispatch:

jobs:
  cpu-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install audit dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Branch whitespace check
        run: git diff --check origin/journal/option-c-v1-factorial-addendum...HEAD
      - name: Compile all Python
        run: python -m compileall -q crackmeanflow scripts tests
      - name: SiT-V1 protocol preflight
        run: python scripts/protocol_preflight_sit_v1.py
      - name: Full pytest
        run: python -m pytest -q
