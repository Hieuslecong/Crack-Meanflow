name: Option-C CI

on:
  push:
    branches:
      - journal/option-c-v1
  workflow_dispatch:

jobs:
  cpu-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install audit dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Git whitespace check
        run: git diff --check HEAD^ HEAD
      - name: Compile all Python
        run: python -m compileall -q crackmeanflow scripts tests
      - name: Option-C protocol preflight
        run: python scripts/protocol_preflight_option_c.py --out /tmp/OPTION_C_V1_ENGINEERING_GATE.json
      - name: Full pytest
        run: python -m pytest -q
