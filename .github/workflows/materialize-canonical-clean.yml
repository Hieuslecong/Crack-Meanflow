name: Materialize canonical clean tree

on:
  push:
    branches:
      - research/local-clean-papergrade-v1-20260905

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify canonical payload
        shell: bash
        run: |
          set -euo pipefail
          cat .canonical_payload/part-* > /tmp/cmf.b64
          base64 -d /tmp/cmf.b64 > /tmp/cmf.tar.xz
          rm -rf /tmp/cmf-tree
          mkdir -p /tmp/cmf-tree
          tar -xJf /tmp/cmf.tar.xz -C /tmp/cmf-tree
          cd /tmp/cmf-tree
          test -f README.md
          test -f configs/protocol/paper_protocol.yaml
          test -f crackmeanflow/factory.py
          test -f reports/FILE_MANIFEST_SHA256.txt
          sha256sum -c reports/FILE_MANIFEST_SHA256.txt

      - name: Replace legacy tree with verified canonical source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/cmf-tree/. .
          test ! -e snapshot_fair_v3
          test ! -e .canonical_payload
          test ! -e .github/workflows/materialize-canonical-clean.yml

      - name: Commit canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: materialize canonical clean source [canonical-materialized]"
          git push
